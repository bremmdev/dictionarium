<svg width="100%" viewBox="94 48 453 368" role="img" style="" xmlns="http://www.w3.org/2000/svg"><title style="fill:#3a342c;stroke:none;color:#3a342c;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, &quot;Times New Roman&quot;, serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Roman abacus tens and units columns set to seventy-nine</title><desc style="fill:#3a342c;stroke:none;color:#3a342c;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, &quot;Times New Roman&quot;, serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Two vertical columns divided by a shared horizontal bar. In the tens column the upper pebble is pushed down and two of four lower pebbles are pushed up, giving seventy. In the units column the upper pebble is pushed down and all four lower pebbles are pushed up, giving nine.</desc>
