<svg width="100%" viewBox="0 80 820 226" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Where the tenses of salūtō fall on a line from past to future</title>
<desc>A horizontal groove runs from the past on the left to the future on the right, with a bar marking now. The pluperfect is a pebble far to the left. The imperfect is a long shaded stretch of the past, and the perfect is a single pebble inside that stretch. The present is a pebble on the bar for now. The future is a pebble far to the right, and the future perfect is a pebble between now and the future.</desc>
<style>
	text { font-family: Georgia, "Times New Roman", serif; }
	.name { fill: #3a342c; font-size: 14px; font-weight: 500; }
	.sub { fill: #5b5348; font-size: 12px; }
	.marker { fill: #5b5348; font-size: 12px; letter-spacing: 0.12em; text-anchor: middle; }
	.now { fill: #8f3e2a; font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-anchor: middle; }
	.leader { fill: none; stroke: #8a7e69; stroke-width: 0.5px; stroke-dasharray: 4px 3px; }
	.dot { fill: #8a7e69; }
	.pebble { fill: #c05b38; stroke: #8f3e2a; stroke-width: 1px; }
</style>

<!-- The groove the pebbles sit in -->
<rect x="30" y="150" width="750" height="28" rx="14" fill="#f3eada" stroke="#dbcba2" stroke-width="0.5"/>

<!-- Imperfect: a stretch of the past, not a point -->
<rect x="190" y="153" width="220" height="22" rx="11" fill="#c05b38" fill-opacity="0.22" stroke="#8f3e2a" stroke-width="1" stroke-dasharray="4 3"/>

<!-- Now: the counting bar, carried down to the time axis -->
<line x1="490" y1="192" x2="490" y2="268" class="leader"/>
<rect x="487" y="134" width="6" height="60" rx="3" fill="#8a7e69"/>

<!-- Pebbles -->
<circle cx="100" cy="164" r="11" class="pebble"/>
<circle cx="330" cy="164" r="11" class="pebble"/>
<circle cx="490" cy="164" r="11" class="pebble"/>
<circle cx="600" cy="164" r="11" class="pebble"/>
<circle cx="730" cy="164" r="11" class="pebble"/>

<!-- Imperfect label, above -->
<g>
	<line x1="290" y1="153" x2="280" y2="128" class="leader"/><circle cx="290" cy="153" r="2" class="dot"/>
	<text x="190" y="104" class="name">Imperfectum</text>
	<text x="190" y="122" class="sub">salūtābam — I was greeting, I used to greet</text>
</g>

<!-- Present label, above -->
<g>
	<line x1="493" y1="136" x2="498" y2="128" class="leader"/><circle cx="493" cy="136" r="2" class="dot"/>
	<text x="500" y="104" class="name">Praesēns</text>
	<text x="500" y="122" class="sub">salūtō — I greet, I am greeting</text>
</g>

<!-- Pluperfect label, below -->
<g>
	<line x1="100" y1="176" x2="86" y2="202" class="leader"/><circle cx="100" cy="176" r="2" class="dot"/>
	<text x="30" y="218" class="name">Plūperfectum</text>
	<text x="30" y="236" class="sub">salūtāveram — I had greeted</text>
</g>

<!-- Perfect label, below -->
<g>
	<line x1="330" y1="176" x2="294" y2="202" class="leader"/><circle cx="330" cy="176" r="2" class="dot"/>
	<text x="280" y="218" class="name">Perfectum</text>
	<text x="280" y="236" class="sub">salūtāvī — I greeted, I have greeted</text>
</g>

<!-- Future perfect label, below: done before a moment still to come -->
<g>
	<line x1="600" y1="176" x2="572" y2="202" class="leader"/><circle cx="600" cy="176" r="2" class="dot"/>
	<text x="540" y="218" class="name">Futūrum exāctum</text>
	<text x="540" y="236" class="sub">salūtāverō — I will have greeted</text>
</g>

<!-- Future label, above: no room below beside the future perfect -->
<g>
	<line x1="730" y1="153" x2="722" y2="128" class="leader"/><circle cx="730" cy="153" r="2" class="dot"/>
	<text x="680" y="104" class="name">Futūrum</text>
	<text x="680" y="122" class="sub">salūtābō — I will greet</text>
</g>

<!-- Time axis -->
<line x1="30" y1="268" x2="774" y2="268" stroke="#8a7e69" stroke-width="1"/>
<path d="M 780 268 L 770 263 L 770 273 Z" fill="#8a7e69"/>
<text x="260" y="292" class="marker">PAST</text>
<text x="490" y="292" class="now">PRESENT</text>
<text x="665" y="292" class="marker">FUTURE</text>
</svg>
